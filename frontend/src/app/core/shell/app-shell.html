<div class="flex min-h-screen flex-col bg-slate-50 text-slate-900">
  @if (health.status() === 'offline') {
    <div class="bg-red-600 px-4 py-2 text-center text-sm font-medium text-white">
      Services offline — check that the backend stack is running
    </div>
  }
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4">
      <a routerLink="/" class="text-xl font-bold tracking-tight">MassSeats</a>
      <nav class="flex items-center gap-6 text-sm font-medium">
        <a
          routerLink="/"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="text-blue-600"
          >Events</a
        >
        <a routerLink="/venues" routerLinkActive="text-blue-600">Venues</a>
        <a routerLink="/admin/events" routerLinkActive="text-blue-600">Admin</a>
      </nav>
      <div class="flex items-center gap-4 text-sm font-medium">
        @if (auth.isAuthenticated()) {
          <span class="text-slate-600">{{ auth.user()?.firstName }}</span>
          <button
            type="button"
            (click)="logout()"
            class="rounded-md border border-slate-300 px-3 py-1.5 text-slate-700 hover:bg-slate-100"
          >
            Logout
          </button>
        } @else {
          <a routerLink="/login" class="text-slate-600 hover:text-slate-900">Login</a>
          <a
            routerLink="/register"
            class="rounded-md bg-slate-900 px-3 py-1.5 text-white hover:bg-slate-700"
          >
            Register
          </a>
        }
      </div>
    </div>
  </header>
  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
    <router-outlet />
  </main>
  <footer class="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500">
    MassSeats — event ticketing platform
  </footer>
</div>
