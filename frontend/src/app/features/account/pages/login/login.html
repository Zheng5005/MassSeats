<section class="mx-auto w-full max-w-md">
  <header class="text-center">
    <p class="text-xs font-semibold uppercase tracking-[0.22em] text-blue-600">Account</p>
    <h1 class="mt-2 font-display text-3xl font-semibold tracking-tight text-slate-900 sm:text-4xl">
      Welcome back
    </h1>
    <p class="mt-2 text-sm text-slate-500">Sign in to manage reservations and your profile.</p>
  </header>

  @if (error(); as message) {
    <div
      class="mt-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
      role="alert"
    >
      {{ message }}
    </div>
  }

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    novalidate
    class="mt-8 space-y-5 rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:p-8"
  >
    <div>
      <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="you@example.com"
        class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
      />
      @if (emailError(); as message) {
        <p class="mt-1 text-sm text-red-600">{{ message }}</p>
      }
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
      />
      @if (passwordError(); as message) {
        <p class="mt-1 text-sm text-red-600">{{ message }}</p>
      }
    </div>

    <button
      type="submit"
      [disabled]="form.invalid"
      class="w-full rounded-md bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Sign in
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-500">
    Don't have an account?
    <a routerLink="/register" class="font-semibold text-blue-600 hover:text-blue-700">Register</a>
  </p>
</section>
